name: mayring-watch
on:
  push:
    branches: ["**"]
  workflow_run:
    workflows:
      - "tests"
      - "Build & Push Image"
    types: [completed]
permissions:
  contents: read
  id-token: write
jobs:
  watch:
    permissions:
      contents: read
      id-token: write   # secretless auth: mints a GitHub OIDC token for /repo-events
    uses: Nileneb/mayring-claude-plugin/.github/workflows/repo-watch.yml@main
