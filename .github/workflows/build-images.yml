name: Build & Push Image

# Release-driven: baut + pusht nileneb/mayring-pi-agent NUR auf Versions-Tags
# (v0.1.1, v1.0.0, …) oder manuell. KEIN Build pro main-Push — Images entstehen
# bewusst per `git tag vX.Y.Z && git push --tags`. Deploy = danach compose-Pin in
# app.linn.games auf den neuen Tag heben (separat, kein Auto-Dispatch).
#
# Secrets (Repo-Settings → Secrets and variables → Actions): DOCKERHUB_USERNAME
# + DOCKERHUB_TOKEN (gleiche Docker-Hub-Creds wie MayringCoder).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mayring-pi-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "pi-agent: build+push image"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: nileneb/mayring-pi-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mayring-pi-agent
          cache-to: type=gha,mode=max,scope=mayring-pi-agent
          provenance: false
          sbom: false
